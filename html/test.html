<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>test flash media </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* --- flash --- */
        #flashMedia {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .mediaWrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #flashMedia img,
        #flashMedia video {
            display: none;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.98);
        }

        #flashMedia h1 {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            text-align: center;
            max-width: 95vw;
            margin: 0;
            color: white;
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            paint-order: stroke fill;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
            line-height: 1.2;
            letter-spacing: 3px;
            z-index: 10;
        }

        #flashMedia.titreSeul {
            background-color: transparent;
            pointer-events: none;
        }

        #flashMedia.titreSeul .mediaWrapper {
            width: 100%;
            height: 100%;
        }

        #flashMedia.titreSeul h1 {
            bottom: 5%;
            font-size: 48px;
            -webkit-text-stroke: 4.8px black;
            width: 95%;
        }
        /* --- fin flash --- */

        #flashControl {
            width: 100%;
            background: #ffffff;
            border-bottom: 2px solid #ccc;
            padding: 30px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 10001;
        }

        #flashControl h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }

        .ctrl-section { margin-bottom: 25px; }
        .ctrl-section label { display: block; font-weight: bold; margin-bottom: 10px; color: #34495e; text-transform: uppercase; font-size: 12px; }

        #ctrlTexte {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .drop-zone {
            border: 2px dashed #3498db;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f0f7ff;
            color: #3498db;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .drop-zone:hover { background: #e1efff; }

        .settings-bg { background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #eee; }
        .config-vertical { display: flex; flex-direction: column; gap: 15px; }

        .field { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
        .field input[type="text"], .field input[type="number"] { width: 120px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        .field input[type="range"] { width: 200px; cursor: pointer; }

        .btn-group-vertical { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-lancer { background: #2ecc71; color: white; padding: 20px; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-lancer:hover { background: #27ae60; }
        .btn-stop { background: #e74c3c; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="flashMedia">
        <div class="mediaWrapper">
            <video id="flashVideo"></video>
            <img id="flashImg">
            <h1 id="flashTitre"></h1>
        </div>
    </div>

    <div id="flashControl">
        <h3>Flash Control - Panneau de Régie</h3>
        
        <div class="ctrl-section">
            <label>Titre du Flash</label>
            <input type="text" id="ctrlTexte" placeholder="Saisissez le texte ici...">
        </div>

        <div class="ctrl-section">
            <label>Sources Médias</label>
            <input type="file" id="fileImg" accept="image/*" style="display:none">
            <input type="file" id="fileVid" accept="video/*" style="display:none">

            <div style="display: flex; gap: 10px; align-items: stretch; margin-bottom: 10px;">
                <div class="drop-zone" id="dropImage" onclick="document.getElementById('fileImg').click()" style="flex: 1; margin-bottom: 0;">
                    🖼️ Image : Glisser ou cliquer
                </div>
                <button onclick="clearMedia('image')" style="background:#eee; border:1px solid #ccc; cursor:pointer; padding:0 15px; border-radius:10px;">✕</button>
            </div>

            <div style="display: flex; gap: 10px; align-items: stretch;">
                <div class="drop-zone" id="dropVideo" onclick="document.getElementById('fileVid').click()" style="flex: 1; margin-bottom: 0;">
                    🎬 Vidéo : Glisser ou cliquer
                </div>
                <button onclick="clearMedia('video')" style="background:#eee; border:1px solid #ccc; cursor:pointer; padding:0 15px; border-radius:10px;">✕</button>
            </div>
        </div>

        <div class="ctrl-section settings-bg">
            <label>Configuration</label>
            <div class="config-vertical">
                <div class="field">
                    <span>⏳ Durée (auto, inf, ou secondes) :</span>
                    <input type="text" id="ctrlDuree" value="auto">
                </div>
                
                <div class="field">
                    <span>⏩ Vitesse : <b id="valVitesse">1.0</b>x</span>
                    <input type="range" id="ctrlVitesse" min="0.5" max="4" step="0.1" value="1" 
                        oninput="document.getElementById('valVitesse').innerText = parseFloat(this.value).toFixed(1)">
                </div>

                <div class="field">
                    <span>🔊 Volume : <b id="valVolume">1.0</b></span>
                    <input type="range" id="ctrlVolume" min="0" max="1" step="0.05" value="1" 
                        oninput="document.getElementById('valVolume').innerText = this.value">
                </div>

                <div class="field checkbox-line">
                    <input type="checkbox" id="ctrlAudioSeul"> 
                    <label for="ctrlAudioSeul">Mode Audio Seul (masquer le visuel)</label>
                </div>
            </div>
        </div>

        <div class="btn-group-vertical">
            <button onclick="lancerFlashDepuisControl()" class="btn-lancer">Lancer le Flash</button>
            <button onclick="resetUI()" class="btn-stop">Arrêt / Reset</button>
        </div>
    </div>

    <script>
        // ===========================================
        // 8. FLASH MEDIA
        // =========================================== 
        // DOM
        const flash = document.querySelector('#flashMedia')
        const flashVideo = document.querySelector('#flashVideo')
        const flashImage = document.querySelector('#flashImg')
        const flashTitre = document.querySelector('#flashTitre')
        const flashWrapper = document.querySelector('.mediaWrapper')

        let flashConfig = {
            video: "",
            image: "",
            texte: "",
            duree: "auto",
            volume: 1,
            vitesse: 1,
            audioSeul: false
        }

        let flashTimeout;

        function flashVerifConfig() {
            // Validation de la durée
            if (flashConfig.duree !== 'inf') {
                const parsedDuree = parseInt(flashConfig.duree);
                if (isNaN(parsedDuree) || parsedDuree <= 0) flashConfig.duree = 'auto';
                else flashConfig.duree = parsedDuree;
            }
            
            if (!flashConfig.video) {
                flashConfig.volume = 1;
                flashConfig.vitesse = 1;
                flashConfig.audioSeul = false;
            } else {
                // Validation de la vitesse (>0)
                const parsedVitesse = parseFloat(flashConfig.vitesse);
                if (isNaN(parsedVitesse) || parsedVitesse <= 0) flashConfig.vitesse = 1;
                else flashConfig.vitesse = parsedVitesse;

                // Validation du volume (entre 0 et 1)
                let parsedVolume = parseFloat(flashConfig.volume);
                if (isNaN(parsedVolume)) flashConfig.volume = 1;
                else flashConfig.volume = Math.min(Math.max(parsedVolume, 0), 1);

                // Validation audioSeul
                if (flashConfig.image) flashConfig.audioSeul = false;
                else {
                    const extension = flashConfig.video.split('.').pop().toLowerCase();
                    const formatsAudio = ['mp3', 'wav', 'ogg', 'm4a', 'aac'];
                    if (formatsAudio.includes(extension)) flashConfig.audioSeul = true;
                    else flashConfig.audioSeul = typeof flashConfig.audioSeul === 'boolean' ? flashConfig.audioSeul : false;
                }
            }

            // Nettoyage + encodage URLs
            flashConfig.video = typeof flashConfig.video === 'string' ? encodeURI(flashConfig.video.trim()) : "";
            flashConfig.image = typeof flashConfig.image === 'string' ? encodeURI(flashConfig.image.trim()) : "";
            flashConfig.texte = typeof flashConfig.texte === 'string' ? flashConfig.texte.trim() : "";

            console.log("Config Flash validée :", flashConfig);
        }

        function flashStart() {
            flashStop();
            flashVerifConfig();

            const video = !!flashVideo && flashConfig.video !== "";
            const image = !!flashImage && flashConfig.image !== "";

            if (flashConfig.audioSeul || (!video && !image)) flash.classList.add('titreSeul');
            else flash.classList.remove('titreSeul');

            if (!video && !image && !flashConfig.texte) return; 

            flashSyncDOMfromConfig();
            flash.style.display = "flex";

            if (flashConfig.texte) flashTitre.style.display = "block";

            // gestion affichage + lecture vidéo
            if (video) {
                flashVideo.volume = flashConfig.volume;
                flashVideo.playbackRate = flashConfig.vitesse;

                let errImg = false;
                let errVid = false;
                
                if (image) {
                    flashImage.style.display = "block";

                    flashImage.onerror = () => {
                        console.warn("Erreur lecture image, audio seul");
                        flashImage.style.display = "none";
                        errImg = true;
                        if (errVid) flashStop();
                    }
                    flashVideo.onerror = () => {
                        console.warn("Erreur lecture vidéo, image seule");
                        errVid = true;
                        if (errImg) flashStop();
                    }

                    flashVideo.play().catch(err => console.warn("Erreur lecture mixte:", err));
                    flashImage.onload = () => flashUpscale(flashImage);
                    if (flashImage.complete) flashUpscale(flashImage);
                } else {
                    if (!flashConfig.audioSeul) {
                        flashVideo.style.display = "block";
                        if (flashVideo.readyState >= 1) flashUpscale(flashVideo);
                        flashVideo.onloadedmetadata = () => flashUpscale(flashVideo);
                    }

                    flashVideo.onerror = () => {
                        console.error("Erreur lecture vidéo");
                        flashStop();
                    }

                    flashVideo.play().catch(err => {
                        if (err.name === 'NotAllowedError' && !flashConfig.audioSeul) {
                            console.warn("Autoplay bloqué avec son, passage en mute");
                            flashVideo.muted = true; // Sécurité de secours ici
                            flashVideo.play();
                        } else {
                            console.error("Erreur lecture vidéo:", err);
                            flashStop();
                        }
                    });
                }
            } else if (image) {
                flashImage.style.display = "block";
                flashImage.onload = () => flashUpscale(flashImage);
                if (flashImage.complete) flashUpscale(flashImage);
                flashImage.onerror = () => {
                    console.error("Erreur lecture image");
                    flashStop();
                }
            }


            // gestion fermeture
            if (flashConfig.duree === 'inf') flashVideo.loop = video ? true : false;
            else if (typeof flashConfig.duree === 'number') {
                if (video) flashVideo.loop = true;
                flashTimeout = setTimeout(() => flashStop(), flashConfig.duree);
            } else {
                if (video) flashVideo.onended = () => flashStop();
                else flashTimeout = setTimeout(() => flashStop(), 5000);
            }
        }

        function flashStop() {
            clearTimeout(flashTimeout);
            flashTimeout = null;
            
            flashVideo.onloadedmetadata = null;
            flashVideo.onerror = null;
            flashVideo.onended = null;
            flashImage.onload = null;
            flashImage.onerror = null;

            flashVideo.pause();
            flashVideo.currentTime = 0;
            flashVideo.muted = false;
            flashVideo.loop = false;

            flashVideo.style.display = "none";
            flashImage.style.display = "none";
            flashTitre.style.display = "none";
            flash.style.display = "none";

            flashWrapper.style.width = "";
            flashWrapper.style.height = "";

            flashVideo.removeAttribute('src');
            flashImage.removeAttribute('src');
            flashTitre.innerHTML = "";

            flashVideo.load();
        }

        function flashAjusterTitre(w, h) {
            if (!flashTitre || !flashConfig.texte) return;

            // 1. Définir la largeur du titre (le côté le plus grand du média)
            const plusGrandCote = Math.max(w, h);
            flashTitre.style.width = `${plusGrandCote * 0.95}px`;

            // 2. Calcul initial pour viser 35 caractères par ligne
            let taillePolice = plusGrandCote / (40 * 0.58);
            flashTitre.style.fontSize = `${taillePolice}px`;

            // 3. SÉCURITÉ : Réduire si la hauteur dépasse 80% de la hauteur du média
            // On utilise offsetHeight pour mesurer la hauteur réelle du bloc de texte
            const hauteurMaxAutorisee = h * 0.8;

            while (flashTitre.offsetHeight > hauteurMaxAutorisee && taillePolice > 8) {
                taillePolice -= 2; // On réduit de 2px à chaque tour
                flashTitre.style.fontSize = `${taillePolice}px`;
            }

            const epaisseurContour = taillePolice / 10;
            flashTitre.style.webkitTextStroke = `${epaisseurContour}px black`;

            console.log(`Titre ajusté : Police ${taillePolice.toFixed(1)}px, Contour ${epaisseurContour.toFixed(1)}px`);
        }

        function flashUpscale(media) {
            if (!media || media.style.display === "none") return;

            // 1. Récupérer les dimensions réelles (intrinsèques) du média
            const originalW = media.tagName === 'IMG' ? media.naturalWidth : media.videoWidth;
            const originalH = media.tagName === 'IMG' ? media.naturalHeight : media.videoHeight;

            if (originalW === 0 || originalH === 0) return;

            // 2. Calculer le ratio pour que le média occupe le max d'espace (mode "contain")
            const ratioW = window.innerWidth / originalW;
            const ratioH = window.innerHeight / originalH;
            
            // On choisit le ratio le plus petit pour ne jamais couper l'image/vidéo
            const scale = Math.min(ratioW, ratioH);
            const finalW = Math.floor(originalW * scale);
            const finalH = Math.floor(originalH * scale);

            
            flashWrapper.style.width = `${finalW}px`;
            flashWrapper.style.height = `${finalH}px`;

            media.style.width = "100%";
            media.style.height = "100%";

            flashAjusterTitre(finalW, finalH);
        }

        function flashSyncDOMfromConfig() {
            if (flashConfig.video) flashVideo.src = flashConfig.video;
            else flashVideo.removeAttribute('src');

            if (flashConfig.image) flashImage.src = flashConfig.image;
            else flashImage.removeAttribute('src'); 

            flashTitre.innerHTML = flashConfig.texte || "";

            flashVideo.load();
        }

        function flashResetDOMStyles() {
            [flash, flashVideo, flashImage, flashTitre, flashWrapper].forEach(el => el.removeAttribute('style'));    
        }

        function flashResetConfig() {
            flashConfig = {
                video: "",
                image: "",
                texte: "",
                duree: "auto",
                volume: 1,
                vitesse: 1,
                audioSeul: false
            }
        }

        function flashResetAll() {
            flashStop();
            flashResetConfig();
            flashSyncDOMfromConfig();
            flashResetDOMStyles();
        }
        // ===========================================
        // FIN FLASH MEDIA
        // ===========================================

        // Initialisation des zones de drag & drop au chargement
        document.addEventListener("DOMContentLoaded", function() {
            // Gestion des zones de Drag & Drop
            setupDropZone('dropImage', 'image', 'fileImg');
            setupDropZone('dropVideo', 'video', 'fileVid');
        });

        function setupDropZone(zoneId, configKey, inputId) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);

            // 1. Gestion du Drag & Drop
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                handleFile(e.dataTransfer.files[0], zone, configKey);
            });

            // 2. Gestion du clic (via l'input caché)
            input.addEventListener('change', (e) => {
                handleFile(e.target.files[0], zone, configKey);
            });
        }

        function handleFile(file, zone, configKey) {
            if (file) {
                // Crée l'URL locale et l'assigne à la config
                flashConfig[configKey] = URL.createObjectURL(file);
                zone.innerText = "✓ " + file.name;
                zone.style.borderColor = "#2ecc71";
                zone.style.color = "#2ecc71";
                zone.style.background = "#f0fff4";
            }
        }

       function lancerFlashDepuisControl() {
            // Mise à jour de la config globale avant le start
            flashConfig.texte = document.getElementById('ctrlTexte').value;
            
            const dureeVal = document.getElementById('ctrlDuree').value.trim().toLowerCase();
            flashConfig.duree = (dureeVal === 'auto' || dureeVal === 'inf') ? dureeVal : (parseFloat(dureeVal) || 'auto');

            flashConfig.vitesse = parseFloat(document.getElementById('ctrlVitesse').value) || 1;
            flashConfig.volume = parseFloat(document.getElementById('ctrlVolume').value); // Le slider 0 à 1
            flashConfig.audioSeul = document.getElementById('ctrlAudioSeul').checked;

            console.log("🔥 Flash lancé avec :", flashConfig);
            flashStart();
        }

        // Fonction pour supprimer un média spécifique
        function clearMedia(type) {
            if (type === 'image') {
                flashConfig.image = "";
                const zone = document.getElementById('dropImage');
                zone.innerText = "🖼️ Image : Glisser ou cliquer pour charger";
                zone.style.borderColor = "";
                zone.style.color = "";
                zone.style.background = ""; 
                document.getElementById('fileImg').value = ""; // Clear l'input file
            } else {
                flashConfig.video = "";
                const zone = document.getElementById('dropVideo');
                zone.innerText = "🎬 Vidéo : Glisser ou cliquer pour charger";
                zone.style.borderColor = "";
                zone.style.color = "";
                zone.style.background = "";
                document.getElementById('fileVid').value = "";
            }
        }

        function resetUI() {
            flashStop();
            flashResetConfig();
            flashSyncDOMfromConfig();

            document.getElementById('ctrlTexte').value = "";
            document.getElementById('ctrlDuree').value = "auto";
            document.getElementById('ctrlVitesse').value = "1";
            document.getElementById('valVitesse').innerText = "1.0";
            document.getElementById('ctrlVolume').value = "1";
            document.getElementById('valVolume').innerText = "1.0";
            document.getElementById('ctrlAudioSeul').checked = false;

            // 4. Reset des zones de drop
            clearMedia('image');
            clearMedia('video');
        }
    </script>
</body>
</html>
